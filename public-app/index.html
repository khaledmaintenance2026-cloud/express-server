<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="/app/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="نظام صيانتي لإدارة الصيانة والإنتاج والسلامة - الماس للعطور">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="صيانتي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>صيانتي</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // دعم الدخول بالبصمة/Face ID على متصفح الويب عبر WebAuthn القياسية —
    // تعمل فقط على رابط HTTPS آمن. قفل جهاز محلي إضافي فوق جلسة دخول
    // موجودة أصلًا (بدون تحقق مع أي سيرفر)، بنفس فلسفة نسخة أندرويد.
    (function () {
      function b64urlEncode(buffer) {
        const bytes = new Uint8Array(buffer);
        let str = '';
        for (let i = 0; i < bytes.byteLength; i++) str += String.fromCharCode(bytes[i]);
        return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      function b64urlDecode(str) {
        str = str.replace(/-/g, '+').replace(/_/g, '/');
        while (str.length % 4) str += '=';
        const bin = atob(str);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
      window.sayanatiWebAuthnSupported = async function () {
        try {
          if (!window.PublicKeyCredential) return false;
          if (typeof PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable !== 'function') return false;
          return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
        } catch (e) {
          return false;
        }
      };
      window.sayanatiWebAuthnRegister = async function (userId, userName) {
        try {
          const challenge = new Uint8Array(32);
          crypto.getRandomValues(challenge);
          const userIdBytes = new TextEncoder().encode(String(userId));
          const cred = await navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: 'صيانتي' },
              user: { id: userIdBytes, name: String(userName), displayName: String(userName) },
              pubKeyCredParams: [
                { type: 'public-key', alg: -7 },
                { type: 'public-key', alg: -257 }
              ],
              authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
              timeout: 60000,
              attestation: 'none'
            }
          });
          if (!cred) return null;
          return b64urlEncode(cred.rawId);
        } catch (e) {
          console.log('WebAuthn register error: ' + e);
          return null;
        }
      };
      window.sayanatiWebAuthnAuthenticate = async function (credentialIdB64) {
        try {
          const idBytes = b64urlDecode(credentialIdB64);
          const challenge = new Uint8Array(32);
          crypto.getRandomValues(challenge);
          const assertion = await navigator.credentials.get({
            publicKey: {
              challenge: challenge,
              allowCredentials: [{ id: idBytes, type: 'public-key' }],
              userVerification: 'required',
              timeout: 60000
            }
          });
          return !!assertion;
        } catch (e) {
          console.log('WebAuthn authenticate error: ' + e);
          return false;
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
